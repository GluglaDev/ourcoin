[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ourcoin"
version = "0.1.0"
description = "Educational independent cryptocurrency with an account-based blockchain"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "License not selected yet" }
authors = [
    { name = "OurCoin contributors" },
]
dependencies = [
    "cryptography>=50,<51",
]

[project.scripts]
ourcoin = "ourcoin.cli:main"

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["ourcoin"]
strict = true
